name: MoneyBot - Import TaniaKsiazka

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-books:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Import 100 produktow TaniaKsiazka
        env:
          SYNC_TOKEN: ${{ secrets.PRICE_SYNC_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import sys
          import urllib.request
          import urllib.error

          token = os.environ.get("SYNC_TOKEN", "").strip()

          if not token:
              sys.exit("BLAD: Brak PRICE_SYNC_TOKEN")

          url = (
              "https://arturitto-moneybot-ai.pages.dev"
              "/api/tania-import"
          )

          request = urllib.request.Request(
              url,
              data=b"{}",
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "MoneyBot-Importer/1.0"
              },
              method="POST"
          )

          print("MoneyBot AI - import TaniaKsiazka")

          try:
              with urllib.request.urlopen(
                  request, timeout=90
              ) as response:
                  result = json.load(response)

              print(json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=True
              ))

              if result.get("status") != "ok":
                  sys.exit(1)

              print("IMPORT ZAKONCZONY POMYSLNIE")

          except urllib.error.HTTPError as error:
              print("BLAD HTTP:", error.code)
              body = error.read().decode(
                  "utf-8", errors="replace"
              )

              try:
                  result = json.loads(body)
                  print("Status:", result.get("status"))
                  print("Komunikat:", result.get("message"))
              except ValueError:
                  print("Serwer zwrocil odpowiedz inna niz JSON")

              sys.exit(1)

          except Exception as error:
              print("BLAD:", type(error).__name__)
              sys.exit(1)
          PY
