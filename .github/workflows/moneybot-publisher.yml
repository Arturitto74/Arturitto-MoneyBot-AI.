name: MoneyBot - automatyczna promocja

on:
  schedule:
    - cron: "0 8,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneybot-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Publikuj oferte
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          BOOKS_RSS_URL: ${{ secrets.BOOKS_RSS_URL }}
        run: |
          python - <<'PY'
          import os
          import hashlib
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          token = os.environ.get("TELEGRAM_TOKEN")
          channel = os.environ.get("TELEGRAM_CHANNEL")

          if not token or not channel:
              raise SystemExit(
                  "Brak konfiguracji Telegram w GitHub Secrets"
              )

          feeds = [
              "https://arturitto-moneybot-ai.pages.dev/promocje"
          ]

          books = os.environ.get("BOOKS_RSS_URL")
          if books:
              feeds.append(books)

          products = []

          for feed in feeds:
              try:
                  request = urllib.request.Request(
                      feed,
                      headers={"User-Agent": "MoneyBotPublisher/1.0"}
                  )
                  with urllib.request.urlopen(
                      request, timeout=20
                  ) as response:
                      xml = response.read()

                  root = ET.fromstring(xml)

                  for item in root.findall(".//item"):
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()

                      if title and link.startswith(
                          "https://arturitto-moneybot-ai.pages.dev/"
                      ):
                          products.append((title, link))

              except Exception as error:
                  print("Blad zrodla RSS:", str(error))

          products = list(dict.fromkeys(products))

          if not products:
              raise SystemExit("Brak ofert do publikacji")

          now = datetime.now(timezone.utc)
          slot = 0 if now.hour < 13 else 1

          seed = f"{now.date()}-{slot}"
          digest = hashlib.sha256(seed.encode()).hexdigest()
          index = int(digest, 16) % len(products)

          title, link = products[index]

          message = (
              "🛍️ MoneyBot AI — wybrana oferta\n\n"
              f"{title[:250]}\n\n"
              f"🔎 Sprawdź produkt:\n{link}\n\n"
              "Materiał zawiera link afiliacyjny."
          )

          url = (
              f"https://api.telegram.org/bot{token}/sendMessage"
          )

          payload = urllib.parse.urlencode({
              "chat_id": channel,
              "text": message,
              "disable_web_page_preview": "false"
          }).encode()

          request = urllib.request.Request(
              url, data=payload, method="POST"
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              print(response.read().decode()[:500])

          print("Oferta opublikowana.")
          PY
